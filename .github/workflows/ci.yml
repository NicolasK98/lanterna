name: CI

# Verifica che codice e immagine si compilino, senza pubblicare nulla
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Controllo sintassi JavaScript
        run: for f in $(find src -name '*.js'); do node --check "$f"; done

      - uses: docker/setup-buildx-action@v4

      - name: Build immagine
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lanterna:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avvio di prova (healthcheck)
        run: |
          docker run -d --name lanterna-ci -p 8081:8081 lanterna:ci
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8081/healthz && exit 0
            sleep 1
          done
          docker logs lanterna-ci
          exit 1
